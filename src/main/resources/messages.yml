# One Million Crops uses the same configurable action format as Rivet and EveryBlock.
# Supported tags: [message], [broadcast], [actionbar], [title], [sound],
# [particles], [firework], [bossbar], and [countdown]. All text uses MiniMessage.
message-palette-version: 1
prefix: '<#8CE99A><bold>CROPS</bold></#8CE99A> <dark_gray>›</dark_gray>'

no-permission:
  enabled: true
  actions:
    - '[message] %prefix% <white>You do not have permission to do that.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.7 1.0'
player-only:
  enabled: true
  actions:
    - '[message] %prefix% <white>Only a player can use that command.</white>'
unknown-crop:
  enabled: true
  actions:
    - '[message] %prefix% <white>No challenge crop matches <#8CE99A>%crop%</#8CE99A>. Try <#8CE99A>/1m status</#8CE99A>.</white>'
reloaded:
  enabled: true
  actions:
    - '[message] %prefix% <white>Configuration and messages reloaded.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
scoreboard-on:
  enabled: true
  actions:
    - '[message] %prefix% <white>Live scoreboard <#8CE99A>enabled</#8CE99A>.</white>'
    - '[sound] UI_BUTTON_CLICK 0.6 1.35'
scoreboard-off:
  enabled: true
  actions:
    - '[message] %prefix% <white>Live scoreboard <gray>hidden</gray>.</white>'
    - '[sound] UI_BUTTON_CLICK 0.6 0.85'
crop-toggle-updating:
  enabled: true
  actions:
    - '[message] %prefix% <white>Updating </white>%crop%<white>...</white>'
crop-enabled:
  enabled: true
  actions:
    - '[message] %prefix% %crop% <white>is now <#8CE99A>enabled</#8CE99A> and counts toward the challenge.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
crop-disabled:
  enabled: true
  actions:
    - '[message] %prefix% %crop% <white>is now <gray>disabled</gray>. Its saved progress is preserved.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 0.8'
crop-toggle-last:
  enabled: true
  actions:
    - '[message] %prefix% <white>At least one crop must remain enabled.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.7 1.0'
crop-toggle-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>The crop configuration could not be updated. Check the console.</white>'
reset-warning:
  enabled: true
  actions:
    - '[message] %prefix% <red><bold>DANGER</bold></red> <dark_gray>•</dark_gray> <white>Use <#8CE99A>/1m reset confirm</#8CE99A> to erase all challenge progress.</white>'
    - '[sound] ENTITY_VILLAGER_NO 0.8 0.8'
reset-complete:
  enabled: true
  actions:
    - '[message] %prefix% <white>All challenge progress was reset. Fresh start!</white>'
    - '[sound] BLOCK_RESPAWN_ANCHOR_DEPLETE 0.8 0.8'
crop-reset-complete:
  enabled: true
  actions:
    - '[message] %prefix% <white>Progress for </white>%crop%<white> was reset.</white>'
    - '[sound] BLOCK_RESPAWN_ANCHOR_DEPLETE 0.7 1.1'
backup-complete:
  enabled: true
  actions:
    - '[message] %prefix% <white>Backup created <dark_gray>•</dark_gray> <#8CE99A>%file%</#8CE99A></white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
backup-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>The backup could not be created. Check the console.</white>'
reload-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Reload failed. Existing progress is safe; check the console.</white>'
reset-failed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Reset failed. No progress was erased; check the console.</white>'
operation-running:
  enabled: true
  actions:
    - '[message] %prefix% <white>Another database operation is already running.</white>'
web-running:
  enabled: true
  actions:
    - '[message] %prefix% <white>Live dashboard <dark_gray>•</dark_gray> <#8CE99A><click:open_url:''%url%''><hover:show_text:''<white>Open dashboard</white>''>%url%</hover></click></#8CE99A></white>'
web-disabled:
  enabled: true
  actions:
    - '[message] %prefix% <white>The live dashboard is disabled or unavailable.</white>'
help:
  enabled: true
  actions:
    - '[message] <#8CE99A><bold>ONE MILLION CROPS</bold></#8CE99A> <dark_gray>—</dark_gray> <white>shared harvest challenge</white>'
    - '[message] <#8CE99A>/progress [crop]</#8CE99A> <dark_gray>—</dark_gray> <white>open challenge progress</white>'
    - '[message] <#8CE99A>/1m status</#8CE99A> <dark_gray>—</dark_gray> <white>show every crop total</white>'
    - '[message] <#8CE99A>/1m scoreboard</#8CE99A> <dark_gray>—</dark_gray> <white>toggle the live sidebar</white>'
    - '[message] <#8CE99A>/1m web</#8CE99A> <dark_gray>—</dark_gray> <white>open the live dashboard</white>'
    - '[message] <#8CE99A>/1m wand</#8CE99A> <dark_gray>—</dark_gray> <white>receive a crop storage wand</white>'
crop-wand-received:
  enabled: true
  actions:
    - '[message] %prefix% <white>Crop Wand received.</white> <gray>Left-click to inspect, right-click to deposit, or shift-right-click to deposit and clear seeds.</gray>'
    - '[sound] ENTITY_ITEM_PICKUP 0.7 1.35'
crop-wand-inventory-full:
  enabled: true
  actions:
    - '[message] %prefix% <white>Make room in your inventory before requesting a Crop Wand.</white>'
crop-wand-container-only:
  enabled: true
  actions:
    - '[message] %prefix% <white>The Crop Wand works on chests, trapped chests, barrels, hoppers, and placed shulker boxes.</white>'
crop-wand-inspect-header:
  enabled: true
  actions:
    - '[message] <#8CE99A><bold>STORAGE CONTENTS</bold></#8CE99A> <dark_gray>•</dark_gray> <white>%total% eligible crops</white>'
crop-wand-inspect-line:
  enabled: true
  actions:
    - '[message] <dark_gray>  •</dark_gray> %crop% <dark_gray>—</dark_gray> <white>%amount%</white>'
crop-wand-inspect-empty:
  enabled: true
  actions:
    - '[message] %prefix% <white>This storage contains no eligible crops.</white>'
crop-wand-ignored:
  enabled: true
  actions:
    - '[message] %prefix% <gray>Skipped <white>%amount%</white> unmarked or blocked crops that may already have counted.</gray>'
crop-wand-deposit-header:
  enabled: true
  actions:
    - '[message] <#8CE99A><bold>CROPS DEPOSITED</bold></#8CE99A> <dark_gray>•</dark_gray> <white>%total% added to the challenge</white>'
    - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP 0.65 1.35'
crop-wand-deposit-line:
  enabled: true
  actions:
    - '[message] <dark_gray>  •</dark_gray> %crop% <dark_gray>—</dark_gray> <#8CE99A>+%amount%</#8CE99A>'
crop-wand-deposit-empty:
  enabled: true
  actions:
    - '[message] %prefix% <white>No eligible crops could be deposited. Crops with completed goals stay in storage.</white>'
crop-wand-seeds-removed:
  enabled: true
  actions:
    - '[message] %prefix% <white>Cleared <#8CE99A>%amount%</#8CE99A> seeds from storage.</white>'
    - '[sound] BLOCK_COMPOSTER_FILL_SUCCESS 0.65 1.1'
crop-wand-seeds-empty:
  enabled: true
  actions:
    - '[message] %prefix% <white>There were no seeds to clear from storage.</white>'
admin-help:
  enabled: true
  actions:
    - '[message] <gray>Admin:</gray> <#8CE99A>/1m crops</#8CE99A> <dark_gray>—</dark_gray> <white>manage challenge crops</white>'
    - '[message] <gray>Admin:</gray> <#8CE99A>/1m summary [now]</#8CE99A> <dark_gray>—</dark_gray> <white>inspect or run the harvest report</white>'
    - '[message] <gray>Admin:</gray> <#8CE99A>/1m backup</#8CE99A> <dark_gray>|</dark_gray> <#8CE99A>reload</#8CE99A> <dark_gray>|</dark_gray> <red>reset [crop] confirm</red>'
status:
  enabled: true
  actions:
    - '[message] <#8CE99A><bold>CHALLENGE PROGRESS</bold></#8CE99A> <dark_gray>•</dark_gray> <white>%completed%/%total% crops complete</white>'
    - '[message] <dark_gray>  •</dark_gray> %crop% <dark_gray>—</dark_gray> <white>%amount%/%target%</white> <dark_gray>(<gray>%percent%%</gray>)</dark_gray>'
milestone:
  enabled: true
  actions:
    - '[broadcast] %prefix% %crop% <white>reached <#8CE99A><bold>%percent%%</bold></#8CE99A>!</white>'
    - '[title] <#8CE99A><bold>%percent%%</bold></#8CE99A> | %crop% <white>milestone reached</white> | 5 | 35 | 10'
    - '[sound] ENTITY_PLAYER_LEVELUP 0.75 %pitch%'
    - '[particles] HAPPY_VILLAGER 24 0.6 0.8 0.6 0.05'
harvest-action-bar:
  enabled: true
  actions:
    - '[actionbar] %entries%'

harvestSummary:
  enabled: true
  amount: 30 # In minutes
  actions:
    - '[message] '
    - '[message] <#8CE99A><bold>HARVEST REPORT</bold></#8CE99A> <dark_gray>•</dark_gray> <white>LAST %minutes% MINUTES</white> <dark_gray>(<gray>%total% crops</gray>)</dark_gray>'
    - '[message] <dark_gray>  •</dark_gray> <white>%player%</white> <dark_gray>—</dark_gray> %amount-display% <white>harvested</white>'
    - '[message] '
    - '[sound] BLOCK_NOTE_BLOCK_CHIME 0.65 1.25'
harvest-summary-countdown:
  enabled: true
  actions:
    - '[countdown] <#8CE99A><bold>NEXT HARVEST</bold></#8CE99A> <dark_gray>•</dark_gray> <white>%time%</white> | GREEN | PROGRESS'
harvest-summary-status:
  enabled: true
  actions:
    - '[message] %prefix% <white>Next harvest report in <#8CE99A>%time%</#8CE99A>.</white> <gray>Current window: <white>%amount%</white> crops from <white>%players%</white> player(s).</gray>'
harvest-summary-forced:
  enabled: true
  actions:
    - '[message] %prefix% <white>Harvest report broadcast. A fresh <#8CE99A>%minutes%-minute</#8CE99A> window has started.</white>'
    - '[sound] UI_BUTTON_CLICK 0.7 1.35'
harvest-summary-not-scheduled:
  enabled: true
  actions:
    - '[message] %prefix% <white>The harvest report is not currently scheduled.</white>'
completed-broadcast:
  enabled: true
  actions:
    - '[broadcast] %prefix% <gradient:#FFF176:#FFD166:#8CE99A><bold>CROP COMPLETE!</bold></gradient> %crop% <white>has reached <#FFD166>%target%</#FFD166>.</white>'
grand-finale:
  enabled: true
  actions:
    - '[broadcast] <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
    - '[broadcast] <gradient:#FFF176:#FFD166:#8CE99A:#74C0FC:#C084FC><bold>EVERY CROP. ONE MILLION EACH.</bold></gradient>'
    - '[broadcast] <white>The One Million Crops challenge is complete. Absolute legends.</white>'
    - '[broadcast] <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>'
crop-celebration:
  enabled: true
  actions:
    - '[title] <gradient:#FFF176:#FFD166:#8CE99A><bold>1,000,000!</bold></gradient> | %crop% <white>is complete!</white> | 10 | 80 | 20'
    - '[bossbar] <#8CE99A><bold>CROP COMPLETE</bold></#8CE99A> <dark_gray>•</dark_gray> %crop% | 8 | GREEN | PROGRESS | 1.0'
    - '[sound] %sound% %volume% %pitch%'
    - '[particles] TOTEM_OF_UNDYING 45 0.8 1.0 0.8 0.08'
    - '[firework] #8CE99A,#FFD166,#FFFFFF | BALL_LARGE | 1 | %fireworks% | %firework-gap%'
finale-celebration:
  enabled: true
  actions:
    - '[title] <gradient:#FFF176:#FFD166:#8CE99A:#74C0FC:#C084FC><bold>CHALLENGE COMPLETE</bold></gradient> | <white>Every crop. One million each. Legendary.</white> | 10 | 100 | 20'
    - '[bossbar] <gradient:#FFD166:#8CE99A><bold>ONE MILLION CROPS COMPLETE</bold></gradient> | 12 | GREEN | PROGRESS | 1.0'
    - '[sound] %sound% %volume% %pitch%'
    - '[particles] TOTEM_OF_UNDYING 80 1.0 1.2 1.0 0.1'
    - '[firework] #FFD166,#8CE99A,#74C0FC,#C084FC,#FFFFFF | STAR | 1 | %fireworks% | %firework-gap%'
